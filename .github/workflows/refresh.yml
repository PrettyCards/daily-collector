# Feildmaster is the actual mastermind behind this, as usual. :P

name: Daily Login
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # About 1 hour before reset
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: npm clean-install --omit=dev
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-proxy
      - name: Update
        env:
          LOGIN_CREDENTIALS: ${{ secrets.LOGIN_CREDENTIALS }}
          ALL_PROXY: socks5h://100.115.6.118:1080
        run: npm start "$LOGIN_CREDENTIALS"
      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          author_name: Trackbot
          default_author: github_actions
          message: "chore: Daily Login"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
